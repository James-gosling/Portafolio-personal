<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stark Industries | Portal de Acceso J.A.R.V.I.S.</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="arc-glow-background"></div>

  <main class="stark-terminal">
    <!-- Encabezado Corporativo Stark -->
    <header class="terminal-header">
      <div class="brand-row">
        <div class="arc-reactor-icon"></div>
        <div class="brand-meta">
          <span class="corp-name">STARK INDUSTRIES</span>
          <span class="protocol-id">J.A.R.V.I.S. DEFENSE MAINFRAME // LEVEL 7 CLEARANCE</span>
        </div>
      </div>
      <h1 class="terminal-title">Autorización de Credenciales de Ingeniería</h1>
      <p class="terminal-subtitle">Registro de personal táctico, arquitectos de sistemas y telemetría de armaduras Mark.</p>
    </header>

    <!-- FORMULARIO PRINCIPAL -->
    <form id="starkForm" class="stark-form" novalidate>
      
      <!-- 1. Nombre Completo -->
      <div class="control-group" id="group-fullname">
        <label for="fullname">Identificador de Agente / Ingeniero <span class="req">*</span></label>
        <input type="text" id="fullname" name="fullname" placeholder="Ej. Anthony E. Stark" autocomplete="off">
        <span class="error-text" id="error-fullname"></span>
      </div>

      <!-- 2. Correo Electrónico -->
      <div class="control-group" id="group-email">
        <label for="email">Enlace de Comunicaciones Seguras (Email) <span class="req">*</span></label>
        <input type="email" id="email" name="email" placeholder="operador@starkindustries.com" autocomplete="off">
        <span class="error-text" id="error-email"></span>
      </div>

      <!-- Fila Doble: Teléfono y División -->
      <div class="form-grid-2">
        <!-- 3. Teléfono Satelital -->
        <div class="control-group" id="group-phone">
          <label for="phone">Canal Satelital Cifrado (Teléfono)</label>
          <input type="tel" id="phone" name="phone" placeholder="+1 (212) STARK-01">
          <span class="error-text" id="error-phone"></span>
        </div>

        <!-- 4. Select: División de Ingeniería -->
        <div class="control-group" id="group-division">
          <label for="division">División Técnica Destino <span class="req">*</span></label>
          <select id="division" name="division">
            <option value="">-- Seleccione División --</option>
            <option value="avionics">Mark Armor Avionics & Flight Control</option>
            <option value="arc">Arc Reactor Clean Energy Matrix</option>
            <option value="cyber">Defensive Cyber-Warfare & Cryptography</option>
            <option value="ai">Neural AI & Synthetic Cognition (J.A.R.V.I.S. Core)</option>
          </select>
          <span class="error-text" id="error-division"></span>
        </div>
      </div>

      <!-- 5. Contraseña Criptográfica -->
      <div class="control-group" id="group-password">
        <label for="password">Llave Biométrica Digital (Password) <span class="req">*</span></label>
        <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres alfanuméricos">
        <span class="error-text" id="error-password"></span>
      </div>

      <!-- 6. Radio Buttons: Complejo Operativo -->
      <div class="control-group" id="group-facility">
        <label class="group-title">Complejo Operativo de Despliegue <span class="req">*</span></label>
        <div class="options-wrapper">
          <label class="stark-radio">
            <input type="radio" name="facility" value="tower">
            <span class="radio-indicator"></span>
            Stark Tower (NYC)
          </label>
          <label class="stark-radio">
            <input type="radio" name="facility" value="compound">
            <span class="radio-indicator"></span>
            Upstate Research Facility
          </label>
          <label class="stark-radio">
            <input type="radio" name="facility" value="armory">
            <span class="radio-indicator"></span>
            Sub-Level 4 Armor Vault
          </label>
        </div>
        <span class="error-text" id="error-facility"></span>
      </div>

      <!-- 7. Checkbox: Protocolo de Confidencialidad -->
      <div class="control-group" id="group-nda">
        <label class="stark-checkbox">
          <input type="checkbox" id="nda" name="nda">
          <span class="checkbox-indicator"></span>
          Ratifico el acuerdo de no divulgación de tecnología Stark y la supervisión de J.A.R.V.I.S. <span class="req">*</span>
        </label>
        <span class="error-text" id="error-nda"></span>
      </div>

      <!-- Banner de Verificación y Éxito -->
      <div id="statusReport" class="status-box" role="status"></div>

      <!-- Botón de Ejecución -->
      <button type="submit" id="submitBtn" class="stark-button">
        <span>INICIAR PROVISIONAMIENTO // J.A.R.V.I.S.</span>
      </button>

      <div class="footer-note">
        CONFIDENTIAL // FOR AUTHORIZED STARK INDUSTRIES PERSONNEL ONLY // © 2026
      </div>
    </form>
  </main>

  <script src="app.js"></script>
</body>
</html>
