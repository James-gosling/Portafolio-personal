<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema | Registro de Credenciales</title>
  <!-- Vinculación de Hoja de Estilos Externa -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="portal-container">
    <header class="form-header">
      <div class="status-badge">SECURE PROTOCOL // TLS 1.3</div>
      <h1>Registro de Acceso Técnico</h1>
      <p>Generación de credenciales para ingenieros y administradores de sistemas.</p>
    </header>

    <!-- FORMULARIO PRINCIPAL -->
    <form id="accessForm" class="tech-form" novalidate>
      
      <!-- 1. Nombre Completo -->
      <div class="form-group" id="group-fullname">
        <label for="fullname">Nombre del Operador <span class="required">*</span></label>
        <input type="text" id="fullname" name="fullname" placeholder="Ej. Rodrigo Valdespino" autocomplete="off">
        <span class="error-msg" id="error-fullname"></span>
      </div>

      <!-- 2. Correo Electrónico -->
      <div class="form-group" id="group-email">
        <label for="email">Correo Institucional / Dev <span class="required">*</span></label>
        <input type="email" id="email" name="email" placeholder="operador@dominio.com" autocomplete="off">
        <span class="error-msg" id="error-email"></span>
      </div>

      <!-- Fila Doble: Teléfono y Rol -->
      <div class="form-row">
        <!-- 3. Teléfono -->
        <div class="form-group" id="group-phone">
          <label for="phone">Teléfono de Enlace</label>
          <input type="tel" id="phone" name="phone" placeholder="+52 (442) 000-0000">
          <span class="error-msg" id="error-phone"></span>
        </div>

        <!-- 4. Lista Desplegable (Select) -->
        <div class="form-group" id="group-role">
          <label for="role">Rol en Infraestructura <span class="required">*</span></label>
          <select id="role" name="role">
            <option value="">-- Seleccionar Nivel --</option>
            <option value="cloud">Cloud / DevOps Engineer</option>
            <option value="security">SecOps / Defensive Cyber</option>
            <option value="software">Software Architecture</option>
          </select>
          <span class="error-msg" id="error-role"></span>
        </div>
      </div>

      <!-- 5. Contraseña -->
      <div class="form-group" id="group-password">
        <label for="password">Llave de Acceso (Password) <span class="required">*</span></label>
        <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres">
        <span class="error-msg" id="error-password"></span>
      </div>

      <!-- 6. Botones de Opción (Radio Buttons) -->
      <div class="form-group" id="group-environment">
        <label class="section-label">Entorno de Despliegue Asignado <span class="required">*</span></label>
        <div class="radio-grid">
          <label class="radio-option">
            <input type="radio" name="environment" value="development">
            <span class="custom-radio"></span>
            Dev-Cluster
          </label>
          <label class="radio-option">
            <input type="radio" name="environment" value="staging">
            <span class="custom-radio"></span>
            Staging
          </label>
          <label class="radio-option">
            <input type="radio" name="environment" value="production">
            <span class="custom-radio"></span>
            Prod-Fortress
          </label>
        </div>
        <span class="error-msg" id="error-environment"></span>
      </div>

      <!-- 7. Casilla de Verificación (Checkbox) -->
      <div class="form-group" id="group-terms">
        <label class="checkbox-option">
          <input type="checkbox" id="terms" name="terms">
          <span class="custom-checkbox"></span>
          Acepto las políticas de Zero Trust y auditoría de accesos. <span class="required">*</span>
        </label>
        <span class="error-msg" id="error-terms"></span>
      </div>

      <!-- Notificación de Éxito Global -->
      <div id="formSuccess" class="success-banner" role="alert"></div>

      <!-- Botón de Envío -->
      <button type="submit" id="submitBtn" class="btn-primary">
        <span>Provisionar Acceso</span>
      </button>
    </form>
  </main>

  <!-- Vinculación del Script JS Externo -->
  <script src="app.js"></script>
</body>
</html>
